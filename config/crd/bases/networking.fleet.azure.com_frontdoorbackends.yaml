---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: frontdoorbackends.networking.fleet.azure.com
spec:
  group: networking.fleet.azure.com
  names:
    categories:
    - fleet-networking
    kind: FrontDoorBackend
    listKind: FrontDoorBackendList
    plural: frontdoorbackends
    shortNames:
    - fdb
    singular: frontdoorbackend
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.profile.name
      name: Profile
      type: string
    - jsonPath: .spec.backend.name
      name: Backend
      type: string
    - jsonPath: .status.conditions[?(@.type=='Accepted')].status
      name: Is-Accepted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FrontDoorBackend is the AFD-side counterpart to TrafficManagerBackend: it
          binds a fleet-scoped ServiceImport (specifically, its L7-FrontDoor exports
          carrying PrivateLinkServiceResourceID — see InternalServiceExportSpec) to a
          FrontDoorProfile, producing an Azure Front Door OriginGroup with one Origin
          per qualifying member-cluster export.

          The shape intentionally mirrors TrafficManagerBackend 1:1 so operators
          authoring both surfaces have a single mental model:

            - Spec.Profile  → parent FrontDoorProfile (same namespace)
            - Spec.Backend  → ServiceImport (same namespace)
            - Spec.Weight   → aggregate traffic weight, distributed across
              per-export weights the same way as ATM (see the
              TrafficManagerBackendSpec.Weight formula).

          Design references:
            - docs/first-party/001-afd-global-load-balancing.md §4 (backend model)
            - docs/first-party/002-afd-implementation-plan.md §6 (reconciler)
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: The desired state of FrontDoorBackend.
            properties:
              backend:
                description: The reference to a backend.
                properties:
                  name:
                    description: |-
                      Name is the reference to the ServiceImport in the same namespace as
                      the FrontDoorBackend object.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.backend is immutable
                  rule: self == oldSelf
              profile:
                description: Which FrontDoorProfile the backend should be attached
                  to.
                properties:
                  name:
                    description: Name is the name of the referenced FrontDoorProfile.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.profile is immutable
                  rule: self == oldSelf
              weight:
                default: 1
                description: |-
                  The aggregate weight of origins behind the serviceImport under the
                  generated Front Door OriginGroup. Possible values are from 0 to 1000.
                  Semantics match TrafficManagerBackendSpec.Weight: the value is
                  distributed across each cluster's exports proportionally to the
                  per-export weight surfaced on the ServiceExport. If weight is set to
                  0, all origins behind the serviceImport will be removed from the
                  OriginGroup (effectively draining traffic).
                format: int64
                maximum: 1000
                minimum: 0
                type: integer
            required:
            - backend
            - profile
            type: object
          status:
            description: The observed status of FrontDoorBackend.
            properties:
              conditions:
                description: Current backend status.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              originGroupResourceID:
                description: |-
                  OriginGroupResourceID is the fully qualified Azure resource Id of
                  the Origin Group created for this backend. Empty while the
                  backend is still being accepted.
                type: string
              origins:
                description: |-
                  Origins contains a list of accepted Azure Front Door origins that
                  are created or updated under the generated OriginGroup.
                items:
                  description: |-
                    FrontDoorOriginStatus captures the status of a single Azure Front Door
                    Origin created under the FrontDoorProfile for this backend.
                  properties:
                    from:
                      description: From is where the origin's underlying export was
                        sourced.
                      properties:
                        cluster:
                          description: cluster is the name of the exporting cluster.
                            Must be a valid RFC-1123 DNS label.
                          type: string
                        weight:
                          description: |-
                            Weight defines the weight configured in the serviceExport from the source cluster.
                            Possible values are from 0 to 1000.
                          format: int64
                          type: integer
                      required:
                      - cluster
                      type: object
                    name:
                      description: Name of the origin (as created inside the AFD OriginGroup).
                      type: string
                    privateLinkServiceResourceID:
                      description: |-
                        PrivateLinkServiceResourceID is the PLS this origin was wired to
                        (see InternalServiceExportSpec.PrivateLinkServiceResourceID).
                      type: string
                    resourceID:
                      description: |-
                        ResourceID is the fully qualified Azure resource Id of the origin.
                        Ex - /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{profile}/originGroups/{group}/origins/{name}
                      type: string
                    weight:
                      description: |-
                        Weight is the effective weight of this origin, after the aggregate
                        FrontDoorBackendSpec.Weight has been distributed across per-export
                        weights. Semantics parallel TrafficManagerEndpointStatus.Weight.
                      format: int64
                      type: integer
                  required:
                  - name
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name max length is 63
          rule: size(self.metadata.name) < 64
    served: true
    storage: true
    subresources:
      status: {}
