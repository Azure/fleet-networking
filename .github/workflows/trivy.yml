name: Trivy Vulnerability Scanner
on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6:00 AM UTC
  push:
    branches:
      - main
  create:
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      simulate_schedule:
        description: 'Simulate a scheduled run (test issue creation/Copilot assignment on vulnerabilities)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  packages: write
  issues: write

env:
  REGISTRY: ghcr.io
  HUB_NET_CONTROLLER_MANAGER_IMAGE_NAME : hub-net-controller-manager
  MEMBER_NET_CONTROLLER_MANAGER_IMAGE_NAME: member-net-controller-manager
  MCS_CONTROLLER_MANAGER_IMAGE_NAME: mcs-controller-manager

  GO_VERSION: '1.25.12'
  TRIVY_ISSUE_TEST_BRANCH: britaniar-test-pr-401-workflow

jobs:
  export-registry:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.export.outputs.registry }}
    steps:
      - id: export
        run: |
          # registry must be in lowercase
          # store the images under dev
          # TODO: need to cleanup dev images periodically 
          echo "::set-output name=registry::$(echo "${{ env.REGISTRY }}/${{ github.repository }}/dev" | tr [:upper:] [:lower:])"
  scan-images:
    needs: export-registry
    env:
      REGISTRY: ${{ needs.export-registry.outputs.registry }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to ${{ env.REGISTRY }}
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: generate image version
        run: echo IMAGE_VERSION=$(git rev-parse --short=7 HEAD) >> $GITHUB_ENV

      - name: Build and push controller manager images to registry with tag ${{ env.IMAGE_VERSION }}
        run: |
          make push
        env:
          REGISTRY: ${{ env.REGISTRY}}
          TAG: ${{ env.IMAGE_VERSION }}

      - name: Scan ${{ env.REGISTRY }}/${{ env.HUB_NET_CONTROLLER_MANAGER_IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.HUB_NET_CONTROLLER_MANAGER_IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
          format: 'json'
          output: 'trivy-hub-net.json'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '5m0s'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_DB_REPOSITORY: mcr.microsoft.com/oss/v2/aquasecurity/trivy-db

      - name: Scan ${{ env.REGISTRY }}/${{ env.MEMBER_NET_CONTROLLER_MANAGER_IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.MEMBER_NET_CONTROLLER_MANAGER_IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
          format: 'json'
          output: 'trivy-member-net.json'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '5m0s'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_DB_REPOSITORY: mcr.microsoft.com/oss/v2/aquasecurity/trivy-db

      - name: Scan ${{ env.REGISTRY }}/${{ env.MCS_CONTROLLER_MANAGER_IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.MCS_CONTROLLER_MANAGER_IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
          format: 'json'
          output: 'trivy-mcs.json'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '5m0s'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_DB_REPOSITORY: mcr.microsoft.com/oss/v2/aquasecurity/trivy-db

      - name: Check for vulnerabilities
        id: check-vulns
        run: |
          has_vulns=false
          for file in trivy-hub-net.json trivy-member-net.json trivy-mcs.json; do
            count=$(jq '[.Results[]? | .Vulnerabilities[]?] | length' "$file")
            if [ "$count" -gt 0 ]; then
              has_vulns=true
              break
            fi
          done
          echo "has_vulns=$has_vulns" >> "$GITHUB_OUTPUT"

      - name: Fail on vulnerabilities (non-scheduled runs)
        if: steps.check-vulns.outputs.has_vulns == 'true' && github.event_name != 'schedule' && github.ref_name != env.TRIVY_ISSUE_TEST_BRANCH && !(github.event_name == 'workflow_dispatch' && inputs.simulate_schedule == true)
        run: |
          echo "::error::Vulnerabilities found. See trivy scan output."
          for file in trivy-hub-net.json trivy-member-net.json trivy-mcs.json; do
            echo "--- $file ---"
            jq -r '.Results[]? | .Vulnerabilities[]? | "\(.VulnerabilityID) \(.Severity) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)"' "$file"
          done
          exit 1

      - name: Build vulnerability summary
        if: steps.check-vulns.outputs.has_vulns == 'true' && (github.event_name == 'schedule' || github.ref_name == env.TRIVY_ISSUE_TEST_BRANCH || (github.event_name == 'workflow_dispatch' && inputs.simulate_schedule == true))
        id: vuln-summary
        run: |
          {
            echo 'body<<EOF'
            echo "## Trivy CVE Scan - $(date -u +%Y-%m-%d)"
            echo ""
            echo "The daily vulnerability scan found **HIGH/CRITICAL** CVEs in our container images."
            echo "Please update the affected Go dependencies in \`go.mod\` to the fixed versions listed below,"
            echo "then run \`go mod tidy\` and verify the build passes with \`make build\`."
            echo ""
            echo "### Vulnerabilities"
            echo ""
            echo "| CVE | Severity | Package | Installed | Fixed | Image |"
            echo "|-----|----------|---------|-----------|-------|-------|"
            for file in trivy-hub-net.json trivy-member-net.json trivy-mcs.json; do
              image=$(echo "$file" | sed 's/trivy-//;s/.json//')
              jq -r --arg img "$image" \
                '.Results[]? | .Vulnerabilities[]? | "| \(.VulnerabilityID) | \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion) | \($img) |"' \
                "$file"
            done | sort -u
            echo ""
            echo "### Instructions"
            echo ""
            echo "1. For each Go library CVE, run: \`go get <package>@<fixed_version>\`"
            echo "2. Run \`go mod tidy\` to clean up dependencies."
            echo "3. Run \`make build\` to verify the build passes."
            echo "4. Run \`make test\` to verify tests pass."
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create issue for Copilot
        if: steps.check-vulns.outputs.has_vulns == 'true' && (github.event_name == 'schedule' || github.ref_name == env.TRIVY_ISSUE_TEST_BRANCH || (github.event_name == 'workflow_dispatch' && inputs.simulate_schedule == true))
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
          script: |
            const today = new Date().toISOString().split('T')[0];
            const title = `fix: address trivy CVEs found on ${today}`;

            // Check if an open issue already exists for today
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,trivy',
              per_page: 10
            });
            let issue = existing.data.find(i => i.title === title);
            if (issue) {
              console.log('Issue already exists for today, reusing it for Copilot assignment.');
            } else {
              const body = process.env.ISSUE_BODY;
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'trivy']
              });
              issue = created.data;
            }

            // Assigning the issue to Copilot requires the GraphQL API since the
            // Copilot coding agent is not a regular user and cannot be set via
            // the REST "assignees" field.
            const suggested = await github.graphql(
              `query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 100) {
                    nodes {
                      login
                      ... on Bot {
                        id
                      }
                    }
                  }
                }
              }`,
              { owner: context.repo.owner, repo: context.repo.repo }
            );
            const copilotActor = suggested.repository.suggestedActors.nodes.find(
              (actor) => actor.login.toLowerCase() === 'copilot-swe-agent' && actor.id
            );
            if (!copilotActor) {
              throw new Error('Copilot is not a suggested assignee for this repository.');
            }
            await github.graphql(
              `mutation($assignableId: ID!, $actorIds: [ID!]!) {
                replaceActorsForAssignable(input: { assignableId: $assignableId, actorIds: $actorIds }) {
                  clientMutationId
                }
              }`,
              { assignableId: issue.node_id, actorIds: [copilotActor.id] }
            );
        env:
          ISSUE_BODY: ${{ steps.vuln-summary.outputs.body }}
