name: Trivy Vulnerability Scanner
on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6:00 AM UTC; findings are reported into a single issue per ISO week
  push:
    branches:
      - main
  create:
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  issues: write

env:
  REGISTRY: ghcr.io
  HUB_NET_CONTROLLER_MANAGER_IMAGE_NAME : hub-net-controller-manager
  MEMBER_NET_CONTROLLER_MANAGER_IMAGE_NAME: member-net-controller-manager
  MCS_CONTROLLER_MANAGER_IMAGE_NAME: mcs-controller-manager

  GO_VERSION: '1.26.9'

jobs:
  export-registry:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.export.outputs.registry }}
    steps:
      - id: export
        run: |
          # registry must be in lowercase
          # store the images under dev
          # TODO: need to cleanup dev images periodically 
          echo "::set-output name=registry::$(echo "${{ env.REGISTRY }}/${{ github.repository }}/dev" | tr [:upper:] [:lower:])"
  scan-images:
    needs: export-registry
    env:
      REGISTRY: ${{ needs.export-registry.outputs.registry }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: generate image version
        run: echo IMAGE_VERSION=$(git rev-parse --short=7 HEAD) >> $GITHUB_ENV

      - name: Build and push controller manager images to registry with tag ${{ env.IMAGE_VERSION }}
        run: |
          make push
        env:
          REGISTRY: ${{ env.REGISTRY}}
          TAG: ${{ env.IMAGE_VERSION }}

      - name: Scan ${{ env.REGISTRY }}/${{ env.HUB_NET_CONTROLLER_MANAGER_IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.HUB_NET_CONTROLLER_MANAGER_IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
          format: 'json'
          output: 'trivy-hub-net.json'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '5m0s'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_DB_REPOSITORY: mcr.microsoft.com/oss/v2/aquasecurity/trivy-db

      - name: Scan ${{ env.REGISTRY }}/${{ env.MEMBER_NET_CONTROLLER_MANAGER_IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.MEMBER_NET_CONTROLLER_MANAGER_IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
          format: 'json'
          output: 'trivy-member-net.json'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '5m0s'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_DB_REPOSITORY: mcr.microsoft.com/oss/v2/aquasecurity/trivy-db

      - name: Scan ${{ env.REGISTRY }}/${{ env.MCS_CONTROLLER_MANAGER_IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.MCS_CONTROLLER_MANAGER_IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
          format: 'json'
          output: 'trivy-mcs.json'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '5m0s'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_DB_REPOSITORY: mcr.microsoft.com/oss/v2/aquasecurity/trivy-db

      - name: Check for vulnerabilities
        id: check-vulns
        run: |
          has_vulns=false
          for file in trivy-hub-net.json trivy-member-net.json trivy-mcs.json; do
            count=$(jq '[.Results[]? | .Vulnerabilities[]?] | length' "$file")
            if [ "$count" -gt 0 ]; then
              has_vulns=true
              break
            fi
          done
          echo "has_vulns=$has_vulns" >> "$GITHUB_OUTPUT"

      - name: Fail on vulnerabilities (non-scheduled runs)
        if: steps.check-vulns.outputs.has_vulns == 'true' && github.event_name != 'schedule'
        run: |
          echo "::error::Vulnerabilities found. See trivy scan output."
          for file in trivy-hub-net.json trivy-member-net.json trivy-mcs.json; do
            echo "--- $file ---"
            jq -r '.Results[]? | .Vulnerabilities[]? | "\(.VulnerabilityID) \(.Severity) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)"' "$file"
          done
          exit 1

      - name: Build vulnerability summary
        if: steps.check-vulns.outputs.has_vulns == 'true' && github.event_name == 'schedule'
        id: vuln-summary
        run: |
          {
            echo 'body<<EOF'
            echo "## Trivy CVE Scan - $(date -u +%G-W%V) (last updated $(date -u +%Y-%m-%d))"
            echo ""
            echo "The latest vulnerability scan found **HIGH/CRITICAL** CVEs in our container images."
            echo "Please update the affected Go dependencies in \`go.mod\` to the fixed versions listed below,"
            echo "then run \`go mod tidy\` and verify the build passes with \`make build\`."
            echo ""
            echo "### Vulnerabilities"
            echo ""
            echo "| CVE | Severity | Package | Installed | Fixed | Image |"
            echo "|-----|----------|---------|-----------|-------|-------|"
            for file in trivy-hub-net.json trivy-member-net.json trivy-mcs.json; do
              image=$(echo "$file" | sed 's/trivy-//;s/.json//')
              jq -r --arg img "$image" \
                '.Results[]? | .Vulnerabilities[]? | "| \(.VulnerabilityID) | \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion) | \($img) |"' \
                "$file"
            done | sort -u
            echo ""
            echo "### Instructions"
            echo ""
            echo "1. For each Go library CVE, run: \`go get <package>@<fixed_version>\`"
            echo "2. Run \`go mod tidy\` to clean up dependencies."
            echo "3. Run \`make build\` to verify the build passes."
            echo "4. Run \`make test\` to verify tests pass."
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update security issue
        if: steps.check-vulns.outputs.has_vulns == 'true' && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The ISO week year can differ from the calendar year near year end.
            const isoWeek = (date) => {
              const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
              d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
              const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
              const week = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
              return `${d.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;
            };

            const currentWeek = isoWeek(new Date());
            const title = `fix: address trivy CVEs found in ${currentWeek}`;
            const securityTeam = '@Azure/fleet-networking-security';
            const body = `${process.env.ISSUE_BODY}\n\n### Security owners\n${securityTeam}`;

            const reportLabels = ['security', 'trivy'];
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: reportLabels.join(','),
              sort: 'created',
              direction: 'desc',
              per_page: 100
            });
            // listForRepo also returns pull requests, which are never Trivy reports.
            const reports = open.filter(i => !i.pull_request);
            const newest = reports[0];
            const thisWeek = newest && isoWeek(new Date(newest.created_at)) === currentWeek ? newest : null;

            if (thisWeek) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: thisWeek.number,
                body: body
              });
              console.log(`Updated issue #${thisWeek.number} with the current scan.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: reportLabels
              });
              console.log(`Created issue #${created.data.number} for ${currentWeek}.`);
            }

            // The current report supersedes older reports and same-week duplicates.
            for (const stale of reports.filter(i => i.number !== thisWeek?.number)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: stale.number,
                body: `Superseded by the scan reported in \`${title}\`; closing this stale report.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: stale.number,
                state: 'closed',
                state_reason: 'not_planned'
              });
              console.log(`Closed stale issue #${stale.number} (created ${stale.created_at}).`);
            }
        env:
          ISSUE_BODY: ${{ steps.vuln-summary.outputs.body }}
