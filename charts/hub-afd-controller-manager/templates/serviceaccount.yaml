apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hub-afd-controller-manager.fullname" . }}-sa
  namespace: {{ .Values.fleetSystemNamespace }}
  labels:
    {{- include "hub-afd-controller-manager.labels" . | nindent 4 }}
    # The azure-workload-identity mutating webhook uses this label to
    # decide whether to project a federated token into pods that reference
    # this ServiceAccount. Without it, no token is projected and the
    # controller falls back to whatever chain azidentity picks — which
    # would defeat the identity-split invariant.
    azure.workload.identity/use: "true"
  annotations:
    # These annotations are what actually bind THIS ServiceAccount to a
    # specific AAD identity. The workload-identity webhook reads them
    # and materializes AZURE_CLIENT_ID / AZURE_TENANT_ID /
    # AZURE_FEDERATED_TOKEN_FILE into the pod's env at admission time.
    #
    # SFI-NS253 §7 invariant: the client-id here MUST be distinct from
    # the hub-net-controller-manager ServiceAccount's client-id. The
    # chart cannot enforce it (values are opaque strings); enforcement
    # lives in the operator's Terraform / az CLI federated-credential
    # setup. Chart install fails loudly if these values are empty
    # (see values.yaml comments).
    azure.workload.identity/client-id: {{ required "azure.clientId is required for Workload Identity" .Values.azure.clientId | quote }}
    azure.workload.identity/tenant-id: {{ required "azure.tenantId is required for Workload Identity" .Values.azure.tenantId | quote }}
