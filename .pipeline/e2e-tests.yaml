trigger:
  branches:
    include:
      - main
  tags:
    include:
      - v*.*.*
pr: none

parameters:
  - name: runLocalServiceConformance
    displayName: Run independent AFD conformance with billable provisioning and exact test Private Link approval
    type: boolean
    default: false
  - name: scenarios
    type: object
    default:
        shared_vnet_atm:
          SCENARIO: atm
          AZURE_NETWORK_SETTING: shared-vnet
          ENABLE_TRAFFIC_MANAGER: 'true'
          ENABLE_AZURE_FRONT_DOOR: 'false'
          E2E_JOB_TIMEOUT: 300
          E2E_TEST_TIMEOUT: 60
        peered_vnet:
          SCENARIO: peered
          AZURE_NETWORK_SETTING: peered-vnet
          ENABLE_TRAFFIC_MANAGER: 'false'
          ENABLE_AZURE_FRONT_DOOR: 'false'
          E2E_JOB_TIMEOUT: 300
          E2E_TEST_TIMEOUT: 60
        dynamic_ip_allocation:
          SCENARIO: dynamic
          AZURE_NETWORK_SETTING: dynamic-ip-allocation
          ENABLE_TRAFFIC_MANAGER: 'false'
          ENABLE_AZURE_FRONT_DOOR: 'false'
          E2E_JOB_TIMEOUT: 300
          E2E_TEST_TIMEOUT: 60
        unsupported:
          SCENARIO: unsupported
          AZURE_NETWORK_SETTING: unsupported
          ENABLE_TRAFFIC_MANAGER: 'false'
          ENABLE_AZURE_FRONT_DOOR: 'false'
          E2E_JOB_TIMEOUT: 300
          E2E_TEST_TIMEOUT: 60
        shared_vnet_afd:
          SCENARIO: afd
          AZURE_NETWORK_SETTING: shared-vnet
          ENABLE_TRAFFIC_MANAGER: 'false'
          ENABLE_AZURE_FRONT_DOOR: 'true'
          E2E_JOB_TIMEOUT: 900
          E2E_TEST_TIMEOUT: 610

pool:
  vmImage: ubuntu-24.04

jobs:
  - ${{ each scenario in parameters.scenarios }}:
    - template: e2e-job.yaml
      parameters:
        jobName: ${{ scenario.key }}
        scenario: ${{ scenario.value }}
  - ${{ if parameters.runLocalServiceConformance }}:
    - template: e2e-job.yaml
      parameters:
        jobName: afd_conformance
        conformance: true
        scenario:
          SCENARIO: conformance
          AZURE_NETWORK_SETTING: shared-vnet
          ENABLE_TRAFFIC_MANAGER: 'false'
          ENABLE_AZURE_FRONT_DOOR: 'true'
          E2E_JOB_TIMEOUT: 450
